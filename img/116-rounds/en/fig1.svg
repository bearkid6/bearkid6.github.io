<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 416" width="1344" height="416" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1344" height="416" fill="#ffffff"/>
<text x="48" y="58" font-size="23" font-weight="700" fill="#1a1a1a">Criteria come before the data, and never change after the results</text>
<text x="48" y="98" font-size="16" fill="#6b6b6b">Every step is logged in the research diary in time order, including rounds that did not pass</text>
<rect x="48" y="148" width="228" height="128" rx="10" fill="#e6eefa" stroke="#2a6fd6" stroke-width="3"/>
<text x="162.0" y="188" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pre-registration</text>
<text x="162.0" y="220" font-size="14.5" fill="#333" text-anchor="middle">Hypothesis and pass bar</text>
<text x="162.0" y="245" font-size="14.5" fill="#333" text-anchor="middle">Expectation, prior probability</text>
<path d="M280 212.0 H292" stroke="#c9c8bf" stroke-width="2"/><path d="M291 207.0 L300 212.0 L291 217.0 Z" fill="#c9c8bf"/>
<rect x="304" y="148" width="228" height="128" rx="10" fill="#ffffff" stroke="#c9c8bf" stroke-width="2"/>
<text x="418.0" y="188" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Data check</text>
<text x="418.0" y="220" font-size="14.5" fill="#333" text-anchor="middle">Check sources, bad data</text>
<text x="418.0" y="245" font-size="14.5" fill="#333" text-anchor="middle">Rules fixed before results</text>
<path d="M536 212.0 H547" stroke="#c9c8bf" stroke-width="2"/><path d="M546 207.0 L555 212.0 L546 217.0 Z" fill="#c9c8bf"/>
<rect x="559" y="148" width="228" height="128" rx="10" fill="#ffffff" stroke="#c9c8bf" stroke-width="2"/>
<text x="673.0" y="188" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Result and verdict</text>
<text x="673.0" y="220" font-size="14.5" fill="#333" text-anchor="middle">Judged as pre-registered</text>
<text x="673.0" y="245" font-size="14.5" fill="#333" text-anchor="middle">Compared with expectation</text>
<path d="M791 212.0 H802" stroke="#c9c8bf" stroke-width="2"/><path d="M801 207.0 L810 212.0 L801 217.0 Z" fill="#c9c8bf"/>
<rect x="814" y="148" width="228" height="128" rx="10" fill="#ffffff" stroke="#c9c8bf" stroke-width="2"/>
<text x="928.0" y="188" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Post hoc checks</text>
<text x="928.0" y="220" font-size="14.5" fill="#333" text-anchor="middle">Labeled separately</text>
<text x="928.0" y="245" font-size="14.5" fill="#333" text-anchor="middle">Verdict unchanged</text>
<path d="M1046 212.0 H1056" stroke="#c9c8bf" stroke-width="2"/><path d="M1055 207.0 L1064 212.0 L1055 217.0 Z" fill="#c9c8bf"/>
<rect x="1068" y="148" width="228" height="128" rx="10" fill="#ffffff" stroke="#c9c8bf" stroke-width="2"/>
<text x="1182.0" y="188" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Decision</text>
<text x="1182.0" y="220" font-size="14.5" fill="#333" text-anchor="middle">Investing: use it or not</text>
<text x="1182.0" y="245" font-size="14.5" fill="#333" text-anchor="middle">Paper: how to report it</text>
<path d="M1182.0 276 V352 H162.0 V286" fill="none" stroke="#c9c8bf" stroke-width="2"/><path d="M157.0 287 L162.0 278 L167.0 287 Z" fill="#c9c8bf"/>
<text x="672.0" y="334" font-size="15.5" fill="#555" text-anchor="middle">Every 3 rounds, check the marginal payoff: if the gain is too small, change direction; a rejected direction is not retried with new parameters</text>
</svg>